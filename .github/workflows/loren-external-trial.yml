name: loren-external-trial

on:
  push:
    branches: [main]
  pull_request:

jobs:
  loren-real-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PKC
        uses: actions/checkout@v4

      - name: Checkout pinned Loren benchmark
        uses: actions/checkout@v4
        with:
          repository: rua-den/loren
          ref: e9e81651d380d7d40998f235cfdc7f119fe67af8
          path: external/loren

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build PKC
        run: dotnet build PKC.sln --configuration Release

      - name: Build Loren Web from the pinned real repository
        working-directory: external/loren
        run: dotnet build src/Loren.Web/Loren.Web.csproj --configuration Release

      - name: Compile Loren product knowledge with PKC
        run: |
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- build external/loren

          FACTS=external/loren/.pkc/facts.json
          CANDIDATES=external/loren/.pkc/feature-candidates.json
          INDEX=external/loren/knowledge/index.md
          RUN=external/loren/knowledge/workflows/run/post-api-run.md
          DEV_RUN=external/loren/knowledge/workflows/run/post-internal-dev-run.md
          APPROVE=external/loren/knowledge/workflows/actionproposals/post-api-action-proposals-proposalid-approve.md

          test -s "$FACTS"
          test -s "$CANDIDATES"
          test -s external/loren/.pkc/product-features.json
          test -s "$INDEX"
          test -s "$RUN"
          test -s "$DEV_RUN"
          test -s "$APPROVE"

          # External-repo acceptance: Loren is Minimal-API-first. PKC must not silently miss its web product surface.
          jq -e '[.facts[] | select(.kind == "endpoint" and .metadata.endpointStyle == "minimal-api")] | length >= 8' "$FACTS" >/dev/null
          jq -e '[.facts[] | select(.kind == "endpoint" and .metadata.endpointStyle == "minimal-api")] | all(.[]; .metadata.analysisMode == "project-semantic" and .metadata.semanticNodeMatch == "matched" and .metadata.endpointRegistrationResolution == "semantic")' "$FACTS" >/dev/null

          jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/api/run" and .metadata.httpMethod == "POST" and .metadata.authorization == "RequireAuthorization")' "$FACTS" >/dev/null
          jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/api/projects" and .metadata.httpMethod == "GET" and .metadata.authorization == "RequireAuthorization")' "$FACTS" >/dev/null
          jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/auth/login" and .metadata.httpMethod == "POST")' "$FACTS" >/dev/null
          jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/api/session" and .metadata.authorization == "RequireAuthorization")' "$FACTS" >/dev/null

          # Product evidence must not be polluted by repo tests or historical spikes.
          ! jq -e '.facts[] | select(.source.path | startswith("tests/") or startswith("spikes/"))' "$FACTS" >/dev/null
          ! jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/brain")' "$FACTS" >/dev/null
          jq -e '[.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/health")] | length == 1' "$FACTS" >/dev/null
          ! grep -Fq 'Brain Discovery' "$INDEX"

          # Handler semantics and multi-project call graph must survive real target-project semantic analysis.
          jq -e '.facts[] | select(.kind == "condition" and .container == "POST /api/run" and (.metadata.conditionExpression // "" | contains("string.IsNullOrWhiteSpace(request.Message)")) and (.metadata.response // "" | contains("Results.BadRequest")))' "$FACTS" >/dev/null
          jq -e '.relations[] | select(.kind == "invokes" and (.target | endswith("LorenRunService.RunAsync")))' "$FACTS" >/dev/null
          jq -e '.relations[] | select(.kind == "invokes" and (.target | endswith("LorenProjectContextBuilder.ListProjectsAsync")))' "$FACTS" >/dev/null

          # Conditional endpoint registration must stay visible instead of being promoted to unconditional product surface.
          jq -e '.facts[] | select(.kind == "endpoint" and .metadata.fullRoute == "/internal/dev/run" and .metadata.availabilityCondition == "developmentRunEndpointEnabled")' "$FACTS" >/dev/null
          grep -Fq 'endpoint is registered only when developmentRunEndpointEnabled' "$DEV_RUN"

          # Minimal API response semantics must survive into PO-readable knowledge.
          grep -Fq 'string.IsNullOrWhiteSpace(request.Message) => return Results.BadRequest' "$RUN"
          grep -Fq 'string.IsNullOrWhiteSpace(request.Message) => return Results.BadRequest' "$DEV_RUN"
          grep -R -Fq 'UnknownProjectAliasException' external/loren/knowledge/workflows
          grep -R -Fq 'Results.NotFound(new { error = exception.Message })' external/loren/knowledge/workflows
          grep -R -Fq 'RequireAuthorization' external/loren/knowledge/workflows

          # Request/payload construction is trace evidence, not a domain state transition.
          ! grep -Fq 'State changes' /dev/null
          ! grep -Fq 'Sets `[GitHubCreateBranchActionExecutor.BranchTargetKey]`' "$APPROVE"
          ! grep -Fq 'Sets `[GitHubCreateBranchActionExecutor.SourceShaTargetKey]`' "$APPROVE"

          # Workflow flow should remain application-oriented; raw semantic relations still retain full evidence.
          ! grep -Fq 'System.Linq.Enumerable' "$RUN"
          ! grep -Fq 'Microsoft.AspNetCore.Http.Results.' "$RUN"
          grep -Fq 'Loren.Web.LorenRunService.RunAsync' "$RUN"

          # The generated index should expose the real external repository areas, not sample/spike concepts.
          grep -Fq 'Projects' "$INDEX"
          grep -Fq 'Run' "$INDEX"
          grep -Fq 'Auth' "$INDEX"

      - name: Upload Loren PKC output for review
        uses: actions/upload-artifact@v4
        with:
          name: loren-pkc-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            external/loren/.pkc
            external/loren/knowledge
