name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build PKC.sln --configuration Release
      - run: dotnet test PKC.sln --configuration Release --no-build
      - name: End-to-end build sample knowledge
        run: |
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- build samples/WorkPlaySample
          test -s samples/WorkPlaySample/.pkc/facts.json
          test -s samples/WorkPlaySample/.pkc/feature-candidates.json
          test -s samples/WorkPlaySample/.pkc/product-features.json
          test -s samples/WorkPlaySample/knowledge/index.md
          test -s samples/WorkPlaySample/knowledge/features/workplay/status-management.md
          test -s samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
          test -s samples/WorkPlaySample/knowledge/workflows/workplay/cancel.md
          test -s samples/WorkPlaySample/knowledge/workflows/workplay/reopen.md
          grep -q '"title": "WorkPlay Status Management"' samples/WorkPlaySample/.pkc/product-features.json
          grep -q '"category": "status-management"' samples/WorkPlaySample/.pkc/product-features.json
          grep -q 'WorkPlay Status Management' samples/WorkPlaySample/knowledge/index.md
          grep -q '3 workflows' samples/WorkPlaySample/knowledge/index.md
          grep -q 'WorkPlay Complete' samples/WorkPlaySample/knowledge/features/workplay/status-management.md
          grep -q 'WorkPlay Cancel' samples/WorkPlaySample/knowledge/features/workplay/status-management.md
          grep -q 'WorkPlay Reopen' samples/WorkPlaySample/knowledge/features/workplay/status-management.md
          grep -q 'Click `Complete`' samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
          grep -q 'ManageWorkPlay' samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
          grep -q 'frontend-static' samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
