name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build PKC.sln --configuration Release
      - run: dotnet test PKC.sln --configuration Release --no-build
      - name: Pack and install PKC as a local .NET tool
        run: |
          rm -rf artifacts/tool /tmp/pkc-tool
          dotnet pack src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -o artifacts/tool
          dotnet tool install --tool-path /tmp/pkc-tool --add-source artifacts/tool RuaDen.Pkc.Tool --version 0.4.2-preview.1
          /tmp/pkc-tool/pkc scan samples/WorkPlaySample
          test -s samples/WorkPlaySample/.pkc/facts.json
          test -s samples/WorkPlaySample/.pkc/feature-candidates.json
      - name: End-to-end build WorkPlay knowledge
        run: |
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- build samples/WorkPlaySample
          test -s samples/WorkPlaySample/.pkc/facts.json
          test -s samples/WorkPlaySample/.pkc/feature-candidates.json
          test -s samples/WorkPlaySample/.pkc/product-features.json
          test -s samples/WorkPlaySample/knowledge/index.md
          test -s samples/WorkPlaySample/knowledge/features/workplay/status-management.md
          test -s samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
          grep -q 'WorkPlay Status Management' samples/WorkPlaySample/knowledge/index.md
          grep -q 'Click `Complete`' samples/WorkPlaySample/knowledge/workflows/workplay/complete.md
          grep -q 'ManageWorkPlay' samples/WorkPlaySample/knowledge/workflows/workplay/complete.md

  poketrade-real-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Build .NET 10 backend
        run: dotnet build samples/PokeTradeSystem/backend/PokeTrade.Api/PokeTrade.Api.csproj --configuration Release
      - name: Build Angular 22 frontend
        working-directory: samples/PokeTradeSystem/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Smoke test business flow
        run: |
          dotnet run --project samples/PokeTradeSystem/backend/PokeTrade.Api/PokeTrade.Api.csproj --configuration Release --no-build > /tmp/poketrade-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://localhost:5080/health && break || sleep 1; done
          curl -fsS http://localhost:5080/health
          ORDER=$(curl -fsS -X POST http://localhost:5080/api/orders -H 'Content-Type: application/json' -d '{"customerName":"CI Trainer","deliveryAddress":"1 Indigo Plateau","lines":[{"cardId":3,"quantity":3}]}')
          echo "$ORDER" | grep -q 'AwaitingStock'
          WORKPLAY_ID=$(curl -fsS http://localhost:5080/api/workplays | jq -r '.[0].id')
          curl -fsS -X PATCH http://localhost:5080/api/workplays/$WORKPLAY_ID/start | grep -q 'InProgress'
          curl -fsS -X PATCH http://localhost:5080/api/workplays/$WORKPLAY_ID/complete -H 'Content-Type: application/json' -d '{"purchasedQuantity":4}' | grep -q 'Completed'
          curl -fsS http://localhost:5080/api/orders | grep -q 'ReadyForDelivery'
          DELIVERY_ID=$(curl -fsS http://localhost:5080/api/deliveries | jq -r '.[0].id')
          curl -fsS -X PATCH http://localhost:5080/api/deliveries/$DELIVERY_ID/dispatch | grep -q 'Dispatched'
          curl -fsS -X PATCH http://localhost:5080/api/deliveries/$DELIVERY_ID/delivered | grep -q 'Delivered'
          curl -fsS http://localhost:5080/api/orders | grep -q 'Delivered'
      - name: Compile PokeTrade product knowledge with PKC
        run: |
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release -- build samples/PokeTradeSystem
          test -s samples/PokeTradeSystem/.pkc/facts.json
          test -s samples/PokeTradeSystem/.pkc/product-features.json
          test -s samples/PokeTradeSystem/knowledge/index.md
          grep -q 'angular-static' samples/PokeTradeSystem/.pkc/facts.json
          grep -q 'ManageWorkPlay' samples/PokeTradeSystem/.pkc/feature-candidates.json
          grep -R -q 'Click `Start`' samples/PokeTradeSystem/knowledge/workflows
          grep -R -q 'Click `Complete`' samples/PokeTradeSystem/knowledge/workflows
          grep -R -q 'Click `Dispatch`' samples/PokeTradeSystem/knowledge/workflows
          grep -R -q 'AwaitingStock' samples/PokeTradeSystem/knowledge || true
