name: targeted-jin12-di-product-value

on:
  push:
    branches: [benchmark/fix1-jin12-1401]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build exact PKC candidate
        run: dotnet build PKC.sln --configuration Release --nologo

      - name: Clone pinned Jin12 CRM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.benchmark/jin12-crm"
          TARGET="$ROOT/repo"
          mkdir -p "$ROOT"
          git init "$TARGET"
          git -C "$TARGET" remote add origin https://github.com/jin12-xyz/CRM.git
          git -C "$TARGET" fetch --depth 1 origin 00493af54d4d9e146d1c6eb75f5dc8f3898f09ec
          git -C "$TARGET" checkout --detach FETCH_HEAD
          test "$(git -C "$TARGET" rev-parse HEAD)" = "00493af54d4d9e146d1c6eb75f5dc8f3898f09ec"

      - name: Build pinned target without modifying source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$GITHUB_WORKSPACE/.benchmark/jin12-crm/repo/CRM.sln" --configuration Release --nologo

      - name: Generate product workspace
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/jin12-crm/repo"
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- run "$TARGET"
          test -s "$TARGET/.pkc/workspace/CLAUDE.md"
          test -s "$TARGET/.pkc/workspace/knowledge/START_HERE.md"
          test -s "$TARGET/.pkc/workspace/_policy/answer-contract.md"
          test -s "$TARGET/.pkc/workspace/_meta/catalog.json"

      - name: Upload phase-1 workspace only
        uses: actions/upload-artifact@v4
        with:
          name: jin12-fix1-phase1-workspace
          if-no-files-found: error
          include-hidden-files: true
          path: .benchmark/jin12-crm/repo/.pkc/workspace/
