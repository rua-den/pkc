name: targeted-kesetovic-fix2-product-value

on:
  push:
    branches: [benchmark/fix2-event-b4d]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact PKC candidate
        run: dotnet build PKC.sln --configuration Release --nologo

      - name: Clone pinned Kesetovic CRM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.benchmark/kesetovic-crm"
          TARGET="$ROOT/repo"
          mkdir -p "$ROOT"
          git init "$TARGET"
          git -C "$TARGET" remote add origin https://github.com/kesetovic/crm-system.git
          git -C "$TARGET" fetch --depth 1 origin 8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7
          git -C "$TARGET" checkout --detach FETCH_HEAD
          test "$(git -C "$TARGET" rev-parse HEAD)" = "8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7"

      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic-crm/repo"
          cd "$TARGET/client"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          test -s node_modules/typescript/lib/typescript.js

      - name: Run focused frontend semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic-crm/repo"
          export PKC_TYPESCRIPT_PATH="$TARGET/client/node_modules/typescript/lib/typescript.js"
          node tests/Pkc.Frontend.Tests/angular-url-expression-regression.cjs
          node tests/Pkc.Frontend.Tests/angular-output-event-bridge-regression.cjs

      - name: Build pinned target without modifying source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic-crm/repo"
          dotnet build "$TARGET/crm-system.sln" --configuration Release --nologo
          cd "$TARGET/client"
          npm run build --if-present

      - name: Generate product workspace
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic-crm/repo"
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- run "$TARGET"
          test -s "$TARGET/.pkc/workspace/CLAUDE.md"
          test -s "$TARGET/.pkc/workspace/knowledge/START_HERE.md"
          test -s "$TARGET/.pkc/workspace/_policy/answer-contract.md"
          test -s "$TARGET/.pkc/workspace/_meta/catalog.json"
          grep -R -Fq 'Click `Pack`' "$TARGET/.pkc/workspace/knowledge/workflows"
          grep -R -Fq 'PUT /api/order/{param}/pack' "$TARGET/.pkc/workspace/knowledge/workflows"

      - name: Upload phase-1 workspace only
        uses: actions/upload-artifact@v4
        with:
          name: kesetovic-fix2-event-phase1-workspace
          if-no-files-found: error
          include-hidden-files: true
          path: .benchmark/kesetovic-crm/repo/.pkc/workspace/
