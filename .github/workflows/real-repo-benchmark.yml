name: product-value-level2

on:
  push:
    branches: [benchmark/product-value-level2-79b0]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: agentic-angular
            repo: hackersandwizards/agentic-engineering-training-angular
            sha: 22f2aab64617f4de7984370a5bd40e8c9535dbf5
          - id: jin12-crm
            repo: jin12-xyz/CRM
            sha: 00493af54d4d9e146d1c6eb75f5dc8f3898f09ec
          - id: kesetovic-crm
            repo: kesetovic/crm-system
            sha: 8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact PKC candidate
        run: dotnet build PKC.sln --configuration Release --nologo

      - name: Clone exact benchmark SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.benchmark/${{ matrix.id }}"
          TARGET="$ROOT/repo"
          mkdir -p "$ROOT"
          git init "$TARGET"
          git -C "$TARGET" remote add origin "https://github.com/${{ matrix.repo }}.git"
          git -C "$TARGET" fetch --depth 1 origin "${{ matrix.sha }}"
          git -C "$TARGET" checkout --detach FETCH_HEAD
          test "$(git -C "$TARGET" rev-parse HEAD)" = "${{ matrix.sha }}"

      - name: Install pinned frontend dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/${{ matrix.id }}/repo"
          case "${{ matrix.id }}" in
            agentic-angular)
              cd "$TARGET/frontend"
              if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
              test -s node_modules/typescript/lib/typescript.js
              ;;
            kesetovic-crm)
              cd "$TARGET/client"
              if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
              test -s node_modules/typescript/lib/typescript.js
              ;;
            jin12-crm)
              echo 'No frontend dependency install required.'
              ;;
          esac

      - name: Build pinned target without modifying source
        id: target_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/${{ matrix.id }}/repo"
          case "${{ matrix.id }}" in
            agentic-angular)
              dotnet build "$TARGET/backend/CrmApi/CrmApi.csproj" --configuration Release --nologo
              cd "$TARGET/frontend"
              npm run build --if-present
              ;;
            jin12-crm)
              dotnet build "$TARGET/CRM.sln" --configuration Release --nologo
              ;;
            kesetovic-crm)
              dotnet build "$TARGET/crm-system.sln" --configuration Release --nologo
              cd "$TARGET/client"
              npm run build --if-present
              ;;
          esac

      - name: Generate phase-1 product workspace
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/${{ matrix.id }}/repo"
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- run "$TARGET"
          WORKSPACE="$TARGET/.pkc/workspace"
          test -s "$WORKSPACE/CLAUDE.md"
          test -s "$WORKSPACE/knowledge/START_HERE.md"
          test -s "$WORKSPACE/_policy/answer-contract.md"
          test -s "$WORKSPACE/_meta/catalog.json"
          {
            echo "## Level-2 ${{ matrix.id }}"
            echo
            echo '- PKC production candidate: `79b0f9fec80a2afb87f43ec7a559a5d54cb87863`'
            echo '- Benchmark wrapper changes workflow only.'
            echo '- Target: `${{ matrix.repo }}@${{ matrix.sha }}`'
            echo '- Phase 1 artifact contains `.pkc/workspace` only.'
            echo "- Target build outcome: `${{ steps.target_build.outcome }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phase-1 workspace only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-level2-workspace
          if-no-files-found: error
          include-hidden-files: true
          path: .benchmark/${{ matrix.id }}/repo/.pkc/workspace/
