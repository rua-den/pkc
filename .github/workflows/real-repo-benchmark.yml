name: fix4-observable-construction-validation

on:
  push:
    branches: [fix/product-value-construction-state]

jobs:
  validate-real-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build unchanged candidate
        run: dotnet build PKC.sln --configuration Release --nologo

      - name: Clone pinned Kesetovic benchmark
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.benchmark/kesetovic"
          TARGET="$ROOT/repo"
          mkdir -p "$ROOT"
          git init "$TARGET"
          git -C "$TARGET" remote add origin https://github.com/kesetovic/crm-system.git
          git -C "$TARGET" fetch --depth 1 origin 8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7
          git -C "$TARGET" checkout --detach FETCH_HEAD
          test "$(git -C "$TARGET" rev-parse HEAD)" = "8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7"

      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic/repo"
          cd "$TARGET/client"
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          test -s node_modules/typescript/lib/typescript.js

      - name: Build pinned target as evidence
        id: target_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic/repo"
          dotnet build "$TARGET/crm-system.sln" --configuration Release --nologo
          cd "$TARGET/client"
          npm run build --if-present

      - name: Generate and verify Kesetovic product workspace
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/kesetovic/repo"
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- run "$TARGET"
          ADD_ORDER="$TARGET/.pkc/workspace/knowledge/workflows/order/addorder.md"
          test -s "$ADD_ORDER"
          grep -Fq 'Sets `newOrder.OrderStatus` to `OrderStatus.NEW`.' "$ADD_ORDER"
          grep -Fq 'Sets `newOrder.BonusAwarded` to `orderDto.OrderPrice * 0.05`.' "$ADD_ORDER"
          grep -Fq 'Sets `newOrder.CustomerName` to `orderDto.CustomerName`.' "$ADD_ORDER"
          {
            echo '## Fix #4 observable construction validation'
            echo
            echo '- Implementation commit under test: `35c8e5c5f856e15568aa963bb2d76268008c5570`'
            echo '- Target: `kesetovic/crm-system@8e3b74bec4fdcd0144bd65f0c1b49c8e801bd2f7`'
            echo "- Target build outcome: `${{ steps.target_build.outcome }}` (recorded independently from PKC generation)."
            echo '- Prior run 35901814917 already passed Release build, focused regressions and the full PKC test suite for the unchanged implementation commit.'
            echo '- AddOrder construction defaults/computation: present in generated State changes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated workspace
        uses: actions/upload-artifact@v4
        with:
          name: fix4-kesetovic-workspace
          if-no-files-found: error
          include-hidden-files: true
          path: .benchmark/kesetovic/repo/.pkc/workspace/
