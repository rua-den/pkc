name: targeted-agentic-fix3-product-value

on:
  push:
    branches: [benchmark/fix3-agentic-79b0]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact PKC candidate
        run: dotnet build PKC.sln --configuration Release --nologo

      - name: Run focused Fix 3 regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test PKC.sln --configuration Release --no-build --filter 'FullyQualifiedName~AngularFormBehaviorTests|FullyQualifiedName~AngularUiValueLineageKnowledgeTests'

      - name: Clone pinned Agentic repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.benchmark/agentic-angular"
          TARGET="$ROOT/repo"
          mkdir -p "$ROOT"
          git init "$TARGET"
          git -C "$TARGET" remote add origin https://github.com/hackersandwizards/agentic-engineering-training-angular.git
          git -C "$TARGET" fetch --depth 1 origin 22f2aab64617f4de7984370a5bd40e8c9535dbf5
          git -C "$TARGET" checkout --detach FETCH_HEAD
          test "$(git -C "$TARGET" rev-parse HEAD)" = "22f2aab64617f4de7984370a5bd40e8c9535dbf5"

      - name: Install pinned frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/agentic-angular/repo"
          cd "$TARGET/frontend"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          test -s node_modules/typescript/lib/typescript.js

      - name: Build pinned target without modifying source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/agentic-angular/repo"
          dotnet build "$TARGET/backend/CrmApi/CrmApi.csproj" --configuration Release --nologo
          cd "$TARGET/frontend"
          npm run build --if-present

      - name: Generate product workspace
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GITHUB_WORKSPACE/.benchmark/agentic-angular/repo"
          dotnet run --project src/Pkc.Cli/Pkc.Cli.csproj --configuration Release --no-build -- run "$TARGET"
          WORKSPACE="$TARGET/.pkc/workspace"
          UPDATE="$WORKSPACE/knowledge/workflows/users/update.md"
          test -s "$WORKSPACE/CLAUDE.md"
          test -s "$WORKSPACE/knowledge/START_HERE.md"
          test -s "$WORKSPACE/_policy/answer-contract.md"
          test -s "$WORKSPACE/_meta/catalog.json"
          test -s "$UPDATE"
          grep -Fq 'MAT_DIALOG_DATA.data.email' "$UPDATE"
          grep -Fq 'EditUserDialogComponent.form.email' "$UPDATE"
          grep -Fq 'EditUserDialogComponent.displayed.email' "$UPDATE"
          {
            echo '## Fix #3 targeted Agentic generation'
            echo
            echo '- PKC candidate: `79b0f9fec80a2afb87f43ec7a559a5d54cb87863`'
            echo '- Target: `hackersandwizards/agentic-engineering-training-angular@22f2aab64617f4de7984370a5bd40e8c9535dbf5`'
            echo '- Users Update displayed-value lineage: generated'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phase-1 workspace only
        uses: actions/upload-artifact@v4
        with:
          name: agentic-fix3-phase1-workspace
          if-no-files-found: error
          include-hidden-files: true
          path: .benchmark/agentic-angular/repo/.pkc/workspace/
